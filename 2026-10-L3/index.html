     данные лекции — ниже в DATA (combine/trainer.py). Ничего не грузит из сети. -->
<style>
  @font-face { font-family: "Days One"; src: url("fonts/DaysOne-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Golos Text"; src: url("fonts/GolosText.ttf") format("truetype"); font-weight: 400 900; font-display: swap; }
  :root {
    --bg: #FAFBFF; --card: #FFFFFF; --ink: #06202b; --muted: #5f6f76; --faint: #7D8A90;
    --line: #E3E8EF; --accent: #1CCFCE; --accent-ink: #0B7F80; --accent-soft: #E3FAFA;
    --good: #1E9E5A; --good-soft: #E6F6ED; --bad: #D64545; --bad-soft: #FDECEC;
    --note: #FFF4CC; --note-ink: #7A5A00;
    --head: "Days One", "Golos Text", system-ui, sans-serif;
    --body: "Golos Text", "Segoe UI", system-ui, sans-serif;
    --r: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 19px/1.45 var(--body); min-height: 100dvh; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }

  /* шапка: прогресс */
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top); }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 12px 0 0; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .35s; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 15px; color: var(--faint); padding: 2px 0 6px; }
  .meta b { font-weight: 600; color: var(--muted); }
  .meta .l, .meta .r { display: flex; align-items: center; gap: 4px 14px; flex-wrap: wrap; }
  .meta .r { justify-content: flex-end; text-align: right; }
  /* «Назад» и «Начать заново» — на каждом экране, тихо, но под палец */
  button.link { width: auto; min-height: 44px; padding: 0 2px; border: 0; background: none; color: var(--accent-ink);
                font: 600 16px/1.2 var(--body); border-radius: 8px; }
  button.link.sure { color: var(--bad); }

  main { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
  .chip { display: inline-block; font-size: 15px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft);
          padding: 4px 12px; border-radius: 999px; margin: 4px 0 10px; }
  h1, h2 { font-family: var(--head); font-weight: 400; line-height: 1.2; margin: 0 0 12px; }
  h1 { font-size: 30px; } h2 { font-size: 24px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; margin: 0 0 14px;
          box-shadow: 0 2px 10px rgba(6, 32, 43, .04); }

  /* «Пройди сам»: шаг сверху держится, экран листается под ним */
  .step { position: sticky; top: 58px; z-index: 4; background: var(--bg); padding: 2px 0 10px; }
  .step .say { font-size: 20px; font-weight: 500; margin: 0 0 6px; }
  .step .how { font-size: 16px; color: var(--muted); margin: 0; }
  .screen { position: relative; width: 100%; border-radius: 22px; overflow: hidden; border: 1px solid var(--line);
            background: #111; cursor: pointer; touch-action: manipulation; user-select: none; }
  .screen.desktop { border-radius: 10px; }
  .screen img { display: block; width: 100%; height: auto; pointer-events: none; }
  .hit { position: absolute; border: 4px solid var(--accent); border-radius: 12px; box-shadow: 0 0 0 9999px rgba(6, 32, 43, .38);
         opacity: 0; transition: opacity .25s; pointer-events: none; }
  .hit.show { opacity: 1; animation: pulse 1.1s ease-in-out infinite; }
  .hit.ok { opacity: 1; border-color: var(--good); box-shadow: 0 0 0 9999px rgba(6, 32, 43, .18); animation: none; }
  @keyframes pulse { 50% { border-color: #fff; } }
  .tap { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
         background: rgba(214, 69, 69, .35); pointer-events: none; animation: tap .6s forwards; }
  @keyframes tap { to { transform: scale(1.8); opacity: 0; } }
  .caption { font-size: 15px; color: var(--faint); margin: 6px 2px 0; }

  /* Широкий экран (ПК): воздух по бокам отдаётся скрину. Телефон — слева во
     всю высоту окна, шаг и кнопки справа; экран ПК — на всю ширину, целиком
     в окне. Кнопки — под заданием, а не у нижнего края. */
  @media (min-width: 900px) {
    .wrap { max-width: 680px; }
    body.wide-phone .wrap { max-width: 1040px; }
    body.wide-desktop .wrap { max-width: 1240px; }
    main { padding-bottom: 40px; }
    footer { position: static; background: none; padding: 0 0 32px; }
    footer .wrap { max-width: 680px; }
    .step { position: static; }
    .walk.phone { display: grid; grid-template-columns: auto minmax(320px, 1fr); gap: 48px; align-items: start; }
    .walk.phone .shot { order: 0; }
    .walk.phone .side { order: 1; position: sticky; top: 70px; }
    .walk.phone .screen { width: auto; height: calc(100dvh - 110px); max-height: var(--h); aspect-ratio: var(--ar); }
    .walk.phone .screen img { height: 100%; }
    .walk.desktop .screen { width: min(100%, calc((100dvh - 250px) * var(--ar))); margin: 0 auto; }
    .walk.desktop .step { max-width: 900px; margin: 0 auto; }
    .side #actions { margin-top: 20px; }
    .side .say { font-size: 24px; }
  }

  /* ответы */
  .say-card { font-size: 22px; line-height: 1.35; font-weight: 500; }
  .feedback { border-radius: var(--r); padding: 16px 18px; margin: 0 0 14px; font-size: 18px; }
  .feedback b { display: block; font-size: 20px; margin-bottom: 4px; }
  .feedback.good { background: var(--good-soft); color: #13603A; }
  .feedback.bad { background: var(--bad-soft); color: #8E2424; }
  .feedback.note { background: var(--note); color: var(--note-ink); }
  .answer ul { margin: 4px 0 12px; padding-left: 22px; } .answer li { margin: 4px 0; }

  /* порядок */
  .slots { list-style: none; margin: 0 0 16px; padding: 0; counter-reset: n; }
  .slots li { counter-increment: n; display: flex; gap: 12px; align-items: center; min-height: 56px; padding: 10px 14px;
              border: 2px dashed var(--line); border-radius: 14px; margin: 0 0 8px; color: var(--faint); }
  .slots li::before { content: counter(n); flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
                      background: var(--line); color: var(--muted); font-weight: 700; font-size: 17px; }
  .slots li.filled { border: 2px solid var(--good); background: var(--good-soft); color: var(--ink); }
  .slots li.filled::before { background: var(--good); color: #fff; }
  .pool { display: grid; gap: 10px; }
  .shake { animation: shake .4s; border-color: var(--bad) !important; background: var(--bad-soft) !important; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* кнопки */
  footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: linear-gradient(rgba(250, 251, 255, 0), var(--bg) 22%);
           padding: 22px 0 calc(14px + env(safe-area-inset-bottom)); }
  #actions { display: grid; gap: 10px; }
  footer .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: 600 19px/1.2 var(--body); min-height: 58px; padding: 12px 18px; border-radius: 16px; border: 2px solid transparent;
           cursor: pointer; color: var(--ink); background: var(--card); border-color: var(--line); width: 100%; }
  button:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 2px; }
  button.main { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.yes { border-color: var(--good); color: #13603A; background: var(--good-soft); }
  button.no { border-color: var(--bad); color: #8E2424; background: var(--bad-soft); }
  button.ghost { background: transparent; border-color: transparent; color: var(--accent-ink); min-height: 48px; }
  button.option { text-align: left; font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }

  .big { font-family: var(--head); font-size: 54px; line-height: 1; color: var(--accent-ink); margin: 8px 0; }
  .stat { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .stat:last-child { border-bottom: 0; }
  .hello { padding-top: 24px; }
  .hello .kicker { font-size: 16px; color: var(--accent-ink); font-weight: 600; margin-bottom: 8px; }
  /* выбор устройств */
  .picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .pick { min-height: 64px; font-size: 20px; }
  .pick[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-ink); color: var(--accent-ink); }
  .pick[aria-pressed="true"]::before { content: "✓ "; }

  /* режим правки (пульт) */
  .editbar { position: sticky; top: 0; z-index: 9; background: var(--note); color: var(--note-ink); font-size: 15px; padding: 8px 0; }
  .editbar .wrap { max-width: 1240px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .editbar select { font: inherit; max-width: 100%; min-height: 36px; border-radius: 8px; border: 1px solid #d9c27a; background: #fff; }
  body.editing header { top: 52px; }
  .t[contenteditable] { outline: 2px dashed rgba(11, 127, 128, .45); outline-offset: 3px; border-radius: 4px; cursor: text; }
  .t[contenteditable]:focus { outline: 2px solid var(--accent-ink); background: var(--accent-soft); }
  #toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); z-index: 10; background: var(--ink); color: #fff;
           padding: 10px 18px; border-radius: 12px; font-size: 16px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; } #toast.bad { background: var(--bad); }
</style>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
// Режим правки (решение 147): включает пульт, когда отдаёт тренажёр со своего
// адреса. На сайте его нет — клиенты видят обычный тренажёр.
const EDIT = window.TRAINER_EDIT || null;
const KEY = `trainer:${DATA.kind}:${DATA.lecture}:${DATA.title}`;
const MEET = DATA.kind === "practice" ? "Практика" : "Лекция";
const PLAT = { android: "Android", ios: "iPhone", phone: "Телефон", pc: "Компьютер" };
const PAD = 0.02;           // промах в 2 % ширины рядом с рамкой — ещё попадание (догадка)
const MIN_TAP = 48;         // рамка меньше пальца — растягиваем до 48 px

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// Текст из лекции: в режиме правки — поле, которое можно исправить.
const T = s => EDIT ? `<span class="t" data-v="${esc(s)}">${esc(s)}</span>` : esc(s);
const view = $("#view"), actions = $("#actions");

// --- состояние: только в браузере (решение 144) ---
let st = load();
if (!st || !("plats" in st)) st = fresh();     // сохранено старой версией (один телефон) — заново
function fresh() { return { plats: null, pos: -1, res: {}, again: [] }; }
function load() { if (EDIT) return null; try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { if (EDIT) return; try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

// --- кадры: упражнение раскладывается на экраны ---
let frames = [];
function plan() {
  frames = [];
  DATA.exercises.forEach(ex => {
    if (ex.platform && st.plats && !fits(ex.platform)) return;
    if (ex.kind === "walk") ex.screens.forEach((s, i) => frames.push({ ex, i, n: ex.screens.length, key: `${ex.id}/${i}` }));
    else if (ex.kind === "dodont") ex.cards.forEach((c, i) => frames.push({ ex, i, n: ex.cards.length, key: `${ex.id}/${i}` }));
    else frames.push({ ex, key: ex.id });
  });
  if (EDIT) return;
  st.again.forEach(id => {
    const ex = DATA.exercises.find(e => e.id === id);
    if (ex) frames.push({ ex, key: `${id}/again`, again: true });
  });
}

// «phone» — шаги на любом телефоне: подходят и Android, и iPhone.
function fits(p) { return st.plats.includes(p) || (p === "phone" && st.plats.some(x => x !== "pc")); }

function go(pos) {
  st.pos = pos; save(); window.scrollTo(0, 0);
  layout(""); $("footer .wrap").appendChild(actions);
  if (pos < 0) return hello();
  if (pos >= frames.length) return finish();
  const f = frames[pos];
  progress(pos);
  ({ walk, dodont, order, recall })[f.ex.kind](f);
  if (EDIT) editable(f);
}
const next = () => go(st.pos + 1);

function progress(pos) {
  $("#bar").style.width = `${Math.round(100 * pos / Math.max(1, frames.length))}%`;
  $("#count").textContent = pos >= 0 && pos < frames.length ? `${pos + 1} из ${frames.length}` : "";
  $("#where").textContent = DATA.lecture ? `${MEET} ${DATA.lecture}` : "";
  // В режиме правки — свои «Назад / Дальше» внизу; клиенту — в шапке.
  $("#back").hidden = EDIT || pos <= 0;
  $("#where").hidden = !$("#back").hidden && matchMedia("(max-width: 420px)").matches;
  const r = $("#restart");
  r.hidden = !!EDIT || pos < 0;
  r.classList.remove("sure"); r.textContent = "Начать заново";
}

// «Назад» — шаг можно пройти ещё раз; в итог идёт первая попытка.
$("#back").onclick = () => go(Math.max(0, Math.min(st.pos, frames.length) - 1));
// «Начать заново» — со второго нажатия: случайный сброс жалко (confirm() на сайте не годится).
$("#restart").onclick = () => {
  const r = $("#restart");
  if (!r.classList.contains("sure")) {
    r.classList.add("sure"); r.textContent = "Точно заново? Нажмите ещё раз";
    clearTimeout(r.t); r.t = setTimeout(() => { r.classList.remove("sure"); r.textContent = "Начать заново"; }, 4000);
    return;
  }
  st = fresh(); save(); hello();
};
function buttons(html) { actions.innerHTML = html; }
// На широком экране кнопки «Пройди сам» с телефоном — в правой колонке, под шагом.
const WIDE = matchMedia("(min-width: 900px)");
function layout(mode) { document.body.className = (mode || "") + (EDIT ? " editing" : ""); }
function placeActions() {
  const side = $(".walk.phone .side");
  (WIDE.matches && side ? side : $("footer .wrap")).appendChild(actions);
}
WIDE.addEventListener("change", placeActions);
function mark(f, v) { if (!(f.key in st.res)) st.res[f.key] = v; save(); }

// --- начало: на чём тренироваться ---
function hello() {
  progress(-1);
  const plats = DATA.platforms || [];
  if (EDIT) { st.plats = null; plan(); return go(0); }
  const resume = st.plats !== null && Object.keys(st.res).length > 0;
  const pick = new Set(st.plats || []);
  view.innerHTML = `<div class="hello">
    <div class="kicker">Тренажёр${DATA.lecture ? ` · ${MEET} ${DATA.lecture}` : ""}</div>
    <h1>${esc(DATA.title)}</h1>
    <p class="muted">Повторите лекцию своими руками: нажимайте на экране туда, куда показывал лектор.
    Без оценок и спешки — ошибаться можно.</p>
    ${plats.length > 1 && !resume ? `<div class="card"><h2>На чём будете тренироваться?</h2>
      <p class="muted">Можно выбрать несколько.</p>
      <div class="picks">${plats.map(p => `<button class="pick" data-p="${p}" aria-pressed="false">${PLAT[p] || p}</button>`).join("")}</div>
      </div>` : ""}</div>`;
  if (resume) {
    buttons(`<button class="main" id="go">Продолжить</button><button class="ghost" id="again">Начать сначала</button>`);
    $("#go").onclick = () => { plan(); go(Math.min(st.pos < 0 ? 0 : st.pos, frames.length)); };
    $("#again").onclick = () => { st = fresh(); save(); hello(); };
  } else if (plats.length > 1) {
    buttons(`<button class="main" id="go" disabled>Выберите, на чём</button>`);
    const goBtn = $("#go");
    view.querySelectorAll(".pick").forEach(b => b.onclick = () => {
      const p = b.dataset.p;
      pick.has(p) ? pick.delete(p) : pick.add(p);
      b.setAttribute("aria-pressed", pick.has(p));
      goBtn.disabled = pick.size === 0;
      goBtn.textContent = pick.size ? "Начать" : "Выберите, на чём";
    });
    goBtn.onclick = () => { st.plats = plats.filter(p => pick.has(p)); plan(); go(0); };
  } else {
    buttons(`<button class="main" id="go">Начать</button>`);
    $("#go").onclick = () => { st.plats = plats; plan(); go(0); };
  }
}

// --- «Пройди сам» ---
function walk(f) {
  const s = f.ex.screens[f.i], has = s.targets.length > 0;
  layout(`wide-${s.kind}`);
  const dev = f.ex.platform ? ` · ${PLAT[f.ex.platform]}` : "";
  view.innerHTML = `<div class="walk ${s.kind}"><div class="side"><div class="step">
      <span class="chip">Пройди сам${dev} · шаг ${f.i + 1} из ${f.n}</span>
      <p class="say">${T(s.text || f.ex.title)}</p>
      <p class="how" id="how">${has ? "Нажмите на экране туда, куда нужно нажать." : "Посмотрите на экран."}</p>
    </div></div>
    <div class="shot"><div class="screen ${s.kind}" id="scr" style="--ar:${s.w}/${s.h};--h:${s.h}px"><img src="${esc(s.img)}" width="${s.w}" height="${s.h}" alt="">
      ${s.targets.map(t => `<div class="hit" style="left:${t[0] * 100}%;top:${t[1] * 100}%;width:${t[2] * 100}%;height:${t[3] * 100}%"></div>`).join("")}
    </div>${s.caption ? `<p class="caption">${T(s.caption)}</p>` : ""}</div></div>`;
  placeActions();
  const scr = $("#scr"), hits = [...scr.querySelectorAll(".hit")];
  if (EDIT) { hits.forEach(h => h.classList.add("ok")); return; }
  if (!has) {
    mark(f, "look");
    buttons(`<button class="main" id="n">Дальше</button>`); $("#n").onclick = next;
    return;
  }
  let missed = false, done = false;
  const hint = () => { hits.forEach(h => h.classList.add("show")); };
  buttons(`<button id="hint">Подсказка: куда нажать</button>`);
  $("#hint").onclick = () => { missed = true; hint(); $("#how").textContent = "Нажмите в выделенное место."; };
  scr.onclick = e => {
    if (done) return;
    const r = scr.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    const padX = Math.max(PAD, (MIN_TAP / 2) / r.width), padY = Math.max(PAD * r.width / r.height, (MIN_TAP / 2) / r.height);
    const hit = s.targets.findIndex(t => x >= t[0] - padX && x <= t[0] + t[2] + padX && y >= t[1] - padY && y <= t[1] + t[3] + padY);
    if (hit >= 0) {
      done = true; mark(f, missed ? "later" : "first");
      hits.forEach(h => h.classList.remove("show")); hits[hit].classList.add("ok");
      $("#how").innerHTML = `<b style="color:var(--good)">Верно ✓</b>`;
      buttons(`<button class="main" id="n">Дальше</button>`); $("#n").onclick = next;
      setTimeout(() => { if (frames[st.pos] === f) next(); }, 900);
    } else {
      missed = true;
      const dot = document.createElement("div"); dot.className = "tap";
      dot.style.left = `${x * 100}%`; dot.style.top = `${y * 100}%`; scr.appendChild(dot); setTimeout(() => dot.remove(), 700);
      hint(); $("#how").innerHTML = `<b style="color:var(--bad)">Не совсем.</b> Нажмите в выделенное место.`;
      hits[0].scrollIntoView({ behavior: "smooth", block: "center" });
    }
  };
}

// --- «Делать или нет?» ---
function dodont(f) {
  const c = f.ex.cards[f.i];
  view.innerHTML = `<span class="chip">Делать или нет? · ${f.i + 1} из ${f.n}</span>
    <h2>${T(f.ex.title)}</h2>
    <div class="card say-card">${T(c.text)}</div><div id="fb"></div>`;
  if (EDIT) { $("#fb").innerHTML = `<p class="muted">Верный ответ: <b>${c.ok ? "делать" : "не делать"}</b></p>`; return; }
  buttons(`<div class="row"><button class="yes" data-a="1">Делать</button><button class="no" data-a="0">Не делать</button></div>`);
  actions.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const right = (b.dataset.a === "1") === c.ok;
    mark(f, right ? "first" : "wrong");
    $("#fb").innerHTML = `<div class="feedback ${right ? "good" : "bad"}"><b>${right ? "Верно ✓" : "Не совсем"}</b>
      ${c.ok ? "Это стоит делать." : "Так делать не стоит."}</div>`;
    buttons(`<button class="main" id="n">Дальше</button>`); $("#n").onclick = next;
  });
}

// --- «Расставь по порядку» ---
function order(f) {
  const steps = f.ex.steps, idx = steps.map((_, i) => i);
  if (EDIT) {
    view.innerHTML = `<span class="chip">Расставь по порядку</span>
      <h2>${T(f.ex.title)}</h2>${f.ex.lead ? `<p class="muted">${T(f.ex.lead)}</p>` : ""}
      <p class="muted">Верный порядок (клиент видит шаги перемешанными):</p>
      <ol class="slots">${steps.map(s => `<li class="filled">${T(s)}</li>`).join("")}</ol>`;
    return;
  }
  do { shuffle(idx); } while (idx.every((v, i) => v === i) && steps.length > 1);
  let placed = 0, miss = false;
  view.innerHTML = `<span class="chip">Расставь по порядку</span>
    <h2>${esc(f.ex.title)}</h2>${f.ex.lead ? `<p class="muted">${esc(f.ex.lead)}</p>` : ""}
    <p class="muted">Нажимайте по очереди: что сначала, что потом.</p>
    <ol class="slots">${steps.map(() => `<li>…</li>`).join("")}</ol>
    <div class="pool">${idx.map(i => `<button class="option" data-i="${i}">${esc(steps[i])}</button>`).join("")}</div>
    <div id="fb" style="margin-top:14px"></div>`;
  buttons("");
  const slots = view.querySelectorAll(".slots li");
  view.querySelectorAll(".pool button").forEach(b => b.onclick = () => {
    if (+b.dataset.i === placed) {
      slots[placed].textContent = steps[placed]; slots[placed].classList.add("filled"); b.remove(); placed++;
      if (placed === steps.length) {
        mark(f, miss ? "later" : "first");
        $("#fb").innerHTML = `<div class="feedback good"><b>Верно ✓</b>Цепочка собрана.</div>`;
        buttons(`<button class="main" id="n">Дальше</button>`); $("#n").onclick = next;
      }
    } else {
      miss = true; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      $("#fb").innerHTML = `<div class="feedback bad"><b>Не совсем</b>Подумайте, что идёт раньше.</div>`;
    }
  });
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }

// --- «Вспомни» ---
function answerHtml(ex) {
  return `<div class="card answer">${ex.answer.map(b => b.items
    ? `${b.lead ? `<p>${T(b.lead)}</p>` : ""}<ul>${b.items.map(i => `<li>${T(i)}</li>`).join("")}</ul>`
    : `<p>${T(b.p)}</p>`).join("")}</div>`;
}
function recall(f) {
  view.innerHTML = `<span class="chip">Вспомни${f.again ? " · ещё раз" : ""}</span>
    <div class="card"><h2 style="margin:0">${T(f.ex.question)}</h2></div>
    <p class="muted" id="tip">Попробуйте ответить про себя или вслух. Потом откройте ответ из лекции.</p>
    <div id="ans"></div>`;
  if (EDIT) { $("#tip").remove(); $("#ans").innerHTML = answerHtml(f.ex); return; }
  buttons(`<button class="main" id="show">Показать ответ</button>`);
  $("#show").onclick = () => {
    $("#tip").remove();
    $("#ans").innerHTML = answerHtml(f.ex);
    buttons(`<p class="muted" style="margin:0;text-align:center;font-size:16px">Вы это помнили?</p>
      <div class="row"><button class="yes" id="y">Помнил ✓</button><button class="no" id="nn">Не помнил</button></div>`);
    $("#y").onclick = () => { mark(f, "remember"); next(); };
    $("#nn").onclick = () => {
      mark(f, "forgot");
      if (!f.again && !st.again.includes(f.ex.id)) { st.again.push(f.ex.id); frames.push({ ex: f.ex, key: `${f.ex.id}/again`, again: true }); }
      next();
    };
  };
}

// --- итог ---
function finish() {
  progress(frames.length);
  $("#bar").style.width = "100%"; $("#back").hidden = !!EDIT;
  if (EDIT) {
    view.innerHTML = `<div class="hello"><div class="kicker">Режим правки</div><div class="big">Конец</div>
      <p class="muted">Все упражнения просмотрены. Правки уже сохранены.</p></div>`;
    buttons(`<button class="main" id="again">К началу</button>`); $("#again").onclick = () => go(0);
    return;
  }
  const r = Object.entries(st.res).filter(([k]) => frames.some(f => f.key === k)).map(([, v]) => v);
  const taps = r.filter(v => v === "first" || v === "later").length + r.filter(v => v === "wrong").length;
  const first = r.filter(v => v === "first").length;
  const mem = r.filter(v => v === "remember").length, forgot = r.filter(v => v === "forgot").length;
  view.innerHTML = `<div class="hello"><div class="kicker">Тренажёр пройден</div>
    <div class="big">Готово!</div>
    <p class="muted">Вы повторили лекцию «${esc(DATA.title)}».</p>
    <div class="card">
      ${taps ? `<div class="stat"><span>С первого раза</span><b>${first} из ${taps}</b></div>` : ""}
      ${mem + forgot ? `<div class="stat"><span>Вспомнили сами</span><b>${mem} из ${mem + forgot}</b></div>` : ""}
    </div>
    <p class="muted">Можно пройти ещё раз — в другой день это закрепит лекцию лучше всего.</p></div>`;
  buttons(`<button class="main" id="again">Пройти заново</button>`);
  $("#again").onclick = () => { const plats = st.plats; st = fresh(); st.plats = plats; save(); plan(); go(0); };
}

// --- правка текста (решение 147): нажал на текст, исправил, щёлкнул мимо — сохранено ---
function post(url, body) {
  return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ course: EDIT.course, lesson: EDIT.lesson, ...body }) })
    .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error || "не сохранилось"); return j; });
}
function toast(text, bad) {
  const t = $("#toast"); t.textContent = text; t.className = bad ? "bad show" : "show";
  clearTimeout(toast.h); toast.h = setTimeout(() => t.className = "", bad ? 5000 : 1600);
}
function replaceAll(v, was, now) {          // правка — во всех местах, где стоит этот текст
  if (typeof v === "string") return v === was ? now : v;
  if (Array.isArray(v)) return v.map(x => replaceAll(x, was, now));
  if (v && typeof v === "object") { for (const k in v) if (!["id", "kind", "img", "platform"].includes(k)) v[k] = replaceAll(v[k], was, now); }
  return v;
}
function editable(f) {
  view.querySelectorAll(".t").forEach(el => {
    el.contentEditable = "true"; el.spellcheck = true;
    el.onclick = e => e.stopPropagation();
    el.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } if (e.key === "Escape") { el.textContent = el.dataset.v; el.blur(); } };
    el.onblur = () => {
      const was = el.dataset.v, now = el.textContent.replace(/\s+/g, " ").trim();
      if (!now) { el.textContent = was; return toast("Пустым текст не бывает — вернул как было", true); }
      if (now === was) return;
      post("/api/trainer/edit", { was, now })
        .then(() => { replaceAll(DATA.exercises, was, now); el.dataset.v = now; toast("Сохранено ✓"); })
        .catch(e => { el.textContent = was; toast(`Не сохранилось: ${e.message}`, true); });
    };
  });
  buttons(`<div class="row"><button id="prev" ${st.pos === 0 ? "disabled" : ""}>← Назад</button>
    <button class="main" id="n">Дальше →</button></div>
    <button class="ghost" id="drop">Убрать это упражнение из тренажёра</button>`);
  $("#prev").onclick = () => go(st.pos - 1);
  $("#n").onclick = next;
  $("#drop").onclick = () => {
    const b = $("#drop");
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = `Точно убрать «${f.ex.title}»? Нажмите ещё раз`; return; }
    post("/api/trainer/drop", { title: f.ex.title, drop: true }).then(() => {
      DATA.exercises = DATA.exercises.filter(e => e !== f.ex);
      const pos = frames.findIndex(x => x.ex === f.ex);
      plan(); toast("Упражнение убрано"); go(Math.min(pos, frames.length));
    }).catch(e => toast(`Не убралось: ${e.message}`, true));
  };
  const sel = $("#jump");
  sel.innerHTML = DATA.exercises.map(ex => `<option value="${esc(ex.id)}" ${ex === f.ex ? "selected" : ""}>${esc(KIND[ex.kind])}${ex.platform ? ` · ${PLAT[ex.platform]}` : ""} — ${esc(ex.title)}</option>`).join("");
  sel.onchange = () => go(frames.findIndex(x => x.ex.id === sel.value));
}
const KIND = { walk: "Пройди сам", dodont: "Делать или нет", order: "По порядку", recall: "Вспомни" };

// --- запуск ---
if (EDIT) {
  document.body.insertAdjacentHTML("afterbegin", `<div class="editbar"><div class="wrap">
    <b>Режим правки.</b> Нажмите на текст, исправьте, щёлкните мимо — сохранится. Клиенты этот режим не видят.
    <select id="jump" aria-label="К упражнению"></select></div></div><div id="toast" role="status"></div>`);
}
if (st.plats !== null) plan();
hello();
</script>
</body>
</html>
